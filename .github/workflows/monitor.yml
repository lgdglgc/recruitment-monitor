name: Recruitment Monitor High-Frequency Scheduler

on:
  schedule:
    # 每天早晨 09:00 (UTC 01:00)、中午 12:00 (UTC 04:00)、傍晚 18:00 (UTC 10:00) 自动触发 (北京时间)
    - cron: '0 1,4,10 * * *'
  # 支持在 GitHub Actions 页面随时手动点击触发运行
  workflow_dispatch:

jobs:
  trigger-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Recruitment Scraper API
        env:
          TARGET_URL: ${{ secrets.VERCEL_PROJECT_URL || 'https://zp.kqsdw.com' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET || 'admin123' }}
        run: |
          echo "Triggering API endpoint: ${TARGET_URL}/api/cron"
          
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${TARGET_URL}/api/cron")
          
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | awk -F: '{print $2}')
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS/d')
          
          echo "Response Body: $BODY"
          echo "HTTP Status Code: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Failed to run monitoring job! HTTP Status: $HTTP_STATUS"
            exit 1
          fi
          
          echo "Monitoring job triggered successfully!"
